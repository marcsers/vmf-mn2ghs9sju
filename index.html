<head>

<title>VideoMetaFix</title>
<style>
  :root { --bg: #f3f4f6; --surface: #ffffff; --sunken: #eceef2; --ink: #16181d; --muted: #626876; --line: #dcdfe5; --rec: #e0352b; --rec-soft: #fbe5e3; --err: #b42318; --focus: #2f6fe4; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #101216; --surface: #181b21; --sunken: #13161b; --ink: #eceef2; --muted: #9aa1ae; --line: #2a2e37; --rec: #ff5a4e; --rec-soft: #3a1d1b; --err: #ff7a6e; --focus: #6d9bff; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; display: grid; place-items: center; padding-inline: 16px; }
  form { width: 100%; max-width: 360px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 14px; }
  h1 { margin: 0; font-size: 22px; display: flex; align-items: center; gap: 10px; }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--rec); box-shadow: 0 0 0 4px var(--rec-soft); }
  p { margin: 0; color: var(--muted); font-size: 14px; }
  label { font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 6px; }
  input[type="password"] { font: inherit; color: var(--ink); background: var(--sunken); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .check { flex-direction: row; align-items: center; gap: 8px; color: var(--ink); font-size: 14px; cursor: pointer; }
  .check input { width: 16px; height: 16px; accent-color: var(--rec); }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 8px; padding: 10px 14px; background: var(--rec); color: #fff; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .msg { color: var(--err); min-height: 1.4em; }
  noscript { color: var(--err); }
</style>
</head>

  const KEY = 'videometafix-key';
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const tob64 = (u) => btoa(String.fromCharCode.apply(null, u));
  const $ = (id) => document.getElementById(id);
  const store = {
    get() {
      try {
        const v = JSON.parse(localStorage.getItem(KEY) || 'null');
        if (v && v.id === P.id && typeof v.k === 'string') return v.k;
        if (v) localStorage.removeItem(KEY); // Schlüssel eines alten Passworts entfernen
      } catch (e) { try { localStorage.removeItem(KEY); } catch (e2) {} }
      return null;
    },
    set(k) { try { localStorage.setItem(KEY, JSON.stringify({ id: P.id, k })); } catch (e) {} },
    clear() { try { localStorage.removeItem(KEY); } catch (e) {} },
  };

  async function unwrap(pw) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw.normalize('NFC')), 'PBKDF2', false, ['deriveKey']);
    const kek = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(P.salt), iterations: P.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.wrapIv) }, kek, b64(P.wrapped)));
  }
  async function openWith(cek) {
    const key = await crypto.subtle.importKey('raw', cek, 'AES-GCM', false, ['decrypt']);
    const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, key, b64(P.data)));
    document.open(); document.write(html); document.close();
  }

  if (!window.crypto || !crypto.subtle) {
    $('msg').textContent = 'Dieser Browser unterstützt die Entschlüsselung nicht. Bitte Chrome, Safari, Firefox oder Edge verwenden.';
    $('go').disabled = true;
    return;
  }
  $('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('msg').textContent = '';
    $('go').disabled = true; $('go').textContent = 'Wird geöffnet …';
    let cek;
    try { cek = await unwrap($('pw').value); }
    catch (err) {
      $('msg').textContent = 'Falsches Passwort.';
      $('go').disabled = false; $('go').textContent = 'Öffnen';
      $('pw').select();
      return;
    }
    if ($('remember').checked) store.set(tob64(cek)); else store.clear();
    try { await openWith(cek); }
    catch (err) {
      $('msg').textContent = 'Die Seite konnte nicht geöffnet werden. Bitte neu laden.';
      $('go').disabled = false; $('go').textContent = 'Öffnen';
    }
  });

  // Gespeicherte Anmeldung erst nach dem Formular-Setup versuchen – ein defekter Eintrag blockiert nichts
  const saved = store.get();
  if (saved) Promise.resolve().then(() => openWith(b64(saved))).catch(() => store.clear());
})();
